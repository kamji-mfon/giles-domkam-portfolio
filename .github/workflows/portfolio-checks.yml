name: Public evidence checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run synthetic examples
        run: |
          python3 examples/check_monitoring_demo.py
          python3 examples/check_observation_contract.py
          python3 examples/check_historian_quality.py
          python3 examples/check_telemetry_lab.py
          python3 examples/check_approval_demo.py
          python3 examples/equilibrium_demo.py
          python3 examples/check_clock_trust.py
          python3 examples/check_degraded_mode.py
          python3 examples/check_reading_schema.py
      - name: Measure example resource use
        run: python3 examples/check_resource_use.py
      - name: Branch coverage of example logic
        run: |
          python3 -m pip install --quiet "coverage==7.10.7"
          for f in check_monitoring_demo check_observation_contract check_historian_quality \
                   check_telemetry_lab check_approval_demo equilibrium_demo \
                   check_clock_trust check_degraded_mode check_reading_schema; do
            python3 -m coverage run --branch --append --source=examples "examples/$f.py" > /dev/null
          done
          python3 -m coverage report -m --omit='examples/check_*' --fail-under=85
      - name: Secret scan (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1
